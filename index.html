<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uygulamalarım</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 36px;
        }

        header p {
            margin: 0;
            color: #d1d5db;
            font-size: 17px;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .card h2 {
            margin-top: 0;
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<header>
    <h1>Uygulamalarım</h1>
    <p>Mobil uygulamalar ve gizlilik politikaları</p>
</header>

<main>

    <div class="card">
        <h2>Uygulamalar</h2>
        <p>
            Geliştirdiğim mobil uygulamalar hakkında bilgi
            ve gizlilik politikalarına buradan ulaşabilirsiniz.
        </p>
    </div>

    <!-- Yeni uygulamalar buraya eklenecek -->

    <div class="card">
        <h2>İletişim</h2>
        <p>
            Uygulamalarla ilgili sorularınız için bizimle iletişime geçebilirsiniz.
        </p>
    </div>

</main>

<footer>
    © 2026 Tüm hakları saklıdır.
</footer>

</body>
</html>
